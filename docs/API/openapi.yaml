                        type: array
                        items:
                          type: object
                          properties:
                            provider:
                              type: string
                              enum: [bge-large, cohere, bge-base, local]
                            enabled:
                              type: boolean
                      cohereApiKey:
                        type: string
                      topKForReranking:
                        type: integer
                      minRerankerScore:
                        type: number
                  uploadLimits:
                    type: object
                    properties:
                      maxFilesPerThread:
                        type: integer
                      maxFileSizeMB:
                        type: integer
                      allowedTypes:
                        type: array
                        items:
                          type: string
                  availableModels:
                    type: array
                    items:
                      type: string
                  modelPresets:
                    type: array
                    items:
                      type: object
                  brandingIcons:
                    type: array
                    items:
                      type: object

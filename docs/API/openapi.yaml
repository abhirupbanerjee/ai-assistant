  # ========================================
  # Agent Bots Public API (API Key Auth)
  # ========================================

  /agent-bots/spec:
    get:
      tags:
        - Agent Bots - Public
      summary: Discover agent bot metadata
      description: |
        Returns simplified metadata JSON for the agent bot associated with the provided API key.
        The API key itself identifies the bot — no slug or prior knowledge is required.
        Useful for external systems to auto-configure agent bot registration.
      operationId: discoverAgentBot
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Agent bot metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBotSpec'
        '401':
          description: Invalid or missing API key
        '404':
          description: Agent bot or version not found
        '429':
          description: Rate limit exceeded

  /agent-bots/{slug}/invoke:
    post:
      tags:
        - Agent Bots - Public
      summary: Invoke agent bot
      description: Execute an agent bot with provided input. Supports sync and async modes.
      operationId: invokeAgentBot
      security:
        - apiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "hr-assistant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: Synchronous execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
          headers:
            X-RateLimit-Limit-RPM:
              schema:
                type: integer
            X-RateLimit-Remaining-RPM:
              schema:
                type: integer
            X-RateLimit-Limit-RPD:
              schema:
                type: integer
            X-RateLimit-Remaining-RPD:
              schema:
                type: integer
        '202':
          description: Async job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    enum: [pending]
        '401':
          description: Invalid or missing API key
        '404':
          description: Agent bot or version not found
        '422':
          description: Input validation error
        '429':
          description: Rate limit exceeded

  /agent-bots/{slug}/upload:
    post:
      tags:
        - Agent Bots - Public
      summary: Upload file
      description: Upload a file to be used in an agent bot invocation. File must be referenced by ID in the invoke request.
      operationId: uploadAgentBotFile
      security:
        - apiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "hr-assistant"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "File to upload"
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    example: "file_abc123"
                  filename:
                    type: string
                    example: "document.pdf"
                  mimeType:
                    type: string
                    example: "application/pdf"
                  fileSize:
                    type: integer
                    example: 1048576
        '400':
          description: Invalid file or upload disabled
        '401':
          description: Invalid or missing API key
        '404':
          description: Agent bot not found

  /agent-bots/{slug}/jobs/{jobId}:
    get:
      tags:
        - Agent Bots - Public
      summary: Get job status
      description: Get the status and results of an async job
      operationId: getAgentBotJob
      security:
        - apiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "hr-assistant"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            example: "job_abc123"
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Job not found

  /agent-bots/{slug}/jobs/{jobId}/outputs/{outputId}/download:
    get:
      tags:
        - Agent Bots - Public
      summary: Download output
      description: Download a generated output file. Supports API key auth or admin session cookie (for Test tab downloads).
      operationId: downloadAgentBotOutput
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "hr-assistant"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            example: "job_abc123"
        - name: outputId
          in: path
          required: true
          schema:
            type: string
            example: "out_xyz789"
      responses:
        '200':
          description: Binary file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Output not found

  # ========================================
  # Consolidated AI & API Setup APIs
  # ========================================

  /admin/ai-setup:
    get:
      tags:
        - Admin - AI & API Setup
      summary: Get the consolidated AI and API setup overview
      description: |
        Returns the viewer and server-enforced organization scope, provider/capability
        registry, selected organization, health, redacted credentials, active credential
        count, and capability configuration. Raw credential values are never returned.

        Requires a global `super_admin` or `admin` role. A `super_admin` may select any
        visible organization with `orgId`; an `admin` is constrained to the organization
        resolved from the session and membership records. A client-supplied organization
        identifier is a display hint and never grants access.
      operationId: getAiSetupOverview
      security:
        - sessionAuth: []
      parameters:
        - name: orgId
          in: query
          required: false
          description: Requested organization selection. Revalidated against the viewer's server-side scope.
          schema:
            type: integer
      responses:
        '200':
          description: Consolidated setup overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSetupOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations:
    post:
      tags:
        - Admin - AI & API Setup
      summary: Create an organization
      description: |
        Creates an `ENTITY` or `INDIVIDUAL` organization. `DEFAULT` is rejected.
        The first member is automatically assigned `org_admin`; an `INDIVIDUAL`
        organization has exactly one member. `adminEmail` optionally delegates the
        initial `org_admin` role to an existing user.
      operationId: createAiSetupOrganization
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, credentialMode]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                type:
                  type: string
                  enum: [ENTITY, INDIVIDUAL]
                  description: "`DEFAULT` cannot be created through this API."
                credentialMode:
                  type: string
                  enum: [PLATFORM_MANAGED, ORGANIZATION_BYOK]
                adminEmail:
                  type: string
                  format: email
                  description: "Existing user to make the first and active `org_admin`; defaults to the creator."
      responses:
        '201':
          description: Organization created and first member promoted
          content:
            application/json:
              schema:
                type: object
                required: [id, memberships]
                properties:
                  id:
                    type: integer
                  memberships:
                    type: array
                    items:
                      type: object
                      required: [userId, role]
                      properties:
                        userId:
                          type: integer
                        role:
                          type: string
                          enum: [org_admin]
        '400':
          description: Invalid body, organization type, credential mode, name, or delegated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
    patch:
      tags:
        - Admin - AI & API Setup
      summary: Update an organization
      description: |
        Updates the name and/or credential mode. Requires `super_admin`, or a global
        `admin` whose server-resolved membership is `org_admin` for this organization.
      operationId: updateAiSetupOrganization
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                credentialMode:
                  type: string
                  enum: [PLATFORM_MANAGED, ORGANIZATION_BYOK]
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSetupOrganization'
        '400':
          description: Invalid ID, body, name, credential mode, or empty update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/capabilities:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
    put:
      tags:
        - Admin - AI & API Setup
      summary: Save organization capability configuration
      description: |
        Upserts capability-to-provider/model/credential mappings for an organization.
        An item with an empty `providerId` clears that capability row. Provider IDs are
        validated against the server registry. Requires `super_admin` or the organization's
        server-resolved `org_admin`.
      operationId: putAiSetupCapabilities
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilities]
              properties:
                capabilities:
                  type: array
                  items:
                    $ref: '#/components/schemas/AiSetupCapabilityConfig'
      responses:
        '200':
          description: Capability configuration saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, saved, cleared]
                properties:
                  ok:
                    type: boolean
                    example: true
                  saved:
                    type: integer
                    minimum: 0
                  cleared:
                    type: integer
                    minimum: 0
        '400':
          description: Invalid ID/body, malformed capability, or unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/credentials:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
    get:
      tags:
        - Admin - AI & API Setup
      summary: List redacted organization credentials
      description: |
        Lists credential metadata for a visible organization. Secret ciphertext is not
        selected and raw credential values are never returned. Requires `super_admin`,
        or a global `admin` with a membership in its own organization.
      operationId: listAiSetupCredentials
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Redacted credential list
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiSetupRedactedCredential'
        '400':
          description: Invalid organization ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin - AI & API Setup
      summary: Create or replace an organization credential
      description: |
        Creates a credential when `credentialId` is omitted, or replaces an existing
        credential for the same organization and provider when it is supplied. The
        submitted `secret` is encrypted by the credential vault and is never returned.
        Requires `super_admin` or the organization's server-resolved `org_admin`.
      operationId: upsertAiSetupCredential
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, secret]
              properties:
                providerId:
                  type: string
                secret:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  description: Raw credential accepted only on write; never echoed, logged, or returned.
                isDefault:
                  type: boolean
                  default: false
                credentialId:
                  type: string
                  description: Existing credential ID to replace. Omit to create a server-generated ID.
      responses:
        '200':
          description: Existing credential replaced
          content:
            application/json:
              schema:
                type: object
                required: [ok, action, credentialId, providerId]
                properties:
                  ok:
                    type: boolean
                    example: true
                  action:
                    type: string
                    enum: [replaced]
                  credentialId:
                    type: string
                  providerId:
                    type: string
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                type: object
                required: [ok, action, credentialId, providerId]
                properties:
                  ok:
                    type: boolean
                    example: true
                  action:
                    type: string
                    enum: [created]
                  credentialId:
                    type: string
                  providerId:
                    type: string
        '400':
          description: Invalid ID/body, missing secret/provider, or unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/credentials/{credentialId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Admin - AI & API Setup
      summary: Perform a credential action
      description: |
        Performs `test`, `replace`, `disable`, `enable`, or envelope-key `rotate`.
        Testing requires view access; all mutations require `super_admin` or the
        organization's server-resolved `org_admin`. Testing decrypts/resolves only on
        the server and returns availability, never the raw key. `replace` requires `secret`.
      operationId: actOnAiSetupCredential
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [test, replace, disable, enable, rotate]
                secret:
                  type: string
                  format: password
                  writeOnly: true
                  description: "Required only when `action` is `replace`; never returned."
      responses:
        '200':
          description: Action result. Test responses include provider and availability message; mutation responses include the action.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, providerId, message]
                    properties:
                      ok:
                        type: boolean
                      providerId:
                        type: string
                      message:
                        type: string
                  - type: object
                    required: [ok, action]
                    properties:
                      ok:
                        type: boolean
                        example: true
                      action:
                        type: string
                        enum: [replace, disable, enable, rotate]
        '400':
          description: Invalid ID, unknown action, or missing replacement secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
    get:
      tags:
        - Admin - AI & API Setup
      summary: List organization members
      description: "Requires `super_admin` or a global `admin` with access to its own organization."
      operationId: listAiSetupMembers
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Organization member list
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiSetupMember'
        '400':
          description: Invalid organization ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Admin - AI & API Setup
      summary: Add a member or delegate organization administration
      description: |
        Adds/reactivates a user by numeric `userId` or existing-user `email`. Setting
        `role` to `org_admin` delegates administration and demotes the prior active
        administrator so exactly one remains. `INDIVIDUAL` organizations reject
        additional members, and the last active administrator cannot be silently
        demoted. Requires `super_admin` or the organization's server-resolved `org_admin`.
      operationId: addAiSetupMember
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [org_admin, member]
                  default: member
              description: "Supply `userId` or `email`. If both are supplied, `userId` is used."
      responses:
        '201':
          description: Member added/reactivated and role assigned
          content:
            application/json:
              schema:
                type: object
                required: [ok, userId, role]
                properties:
                  ok:
                    type: boolean
                    example: true
                  userId:
                    type: integer
                  role:
                    type: string
                    enum: [org_admin, member]
        '400':
          description: Invalid input, individual-organization member constraint, or last-admin invariant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
      - name: userId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - Admin - AI & API Setup
      summary: Change an organization member role
      description: |
        Promoting a member delegates `org_admin` and demotes the previous active
        administrator. Demoting the last active `org_admin` is blocked. Requires
        `super_admin` or the organization's server-resolved `org_admin`.
      operationId: updateAiSetupMember
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [org_admin, member]
      responses:
        '200':
          description: Member role changed
          content:
            application/json:
              schema:
                type: object
                required: [ok, userId, role]
                properties:
                  ok:
                    type: boolean
                    example: true
                  userId:
                    type: integer
                  role:
                    type: string
                    enum: [org_admin, member]
        '400':
          description: Invalid ID/role or attempt to demote the last active administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Admin - AI & API Setup
      summary: Remove an organization member
      description: |
        Removes a member. Removing the last active `org_admin` is blocked until a
        successor is assigned. Requires `super_admin` or the organization's
        server-resolved `org_admin`.
      operationId: deleteAiSetupMember
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          description: Invalid ID or attempt to remove the last active administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/audit:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
    get:
      tags:
        - Admin - AI & API Setup
      summary: Get an organization's credential audit log
      description: |
        Returns up to 500 newest credential audit entries for the organization.
        Entries contain redacted detail only. Requires `super_admin`, or a global
        `admin` scoped to its own organization.
      operationId: getAiSetupOrganizationAudit
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Redacted organization credential audit
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/AiSetupAuditEntry'
        '400':
          description: Invalid organization ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/audit:
    get:
      tags:
        - Admin - AI & API Setup
      summary: Get the global credential audit log
      description: |
        Returns up to 500 newest organization credential audit entries across the
        platform. Every entry is redacted. This route requires global `super_admin`;
        a regular `admin`, including an `org_admin`, receives `403 FORBIDDEN`.
      operationId: getAiSetupGlobalAudit
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Redacted global credential audit
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/AiSetupAuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global super administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: Super admin access required for the global audit
                code: FORBIDDEN
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-setup/organizations/{id}/usage:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric organization ID. Server-side organization scope is always enforced.
        schema:
          type: integer
    get:
      tags:
        - Admin - AI & API Setup
      summary: Get organization-scoped token usage and cost
      description: |
        Returns usage attributed to the organization and credential for the selected
        interval. `days` defaults to 30, rejects non-numeric input, and clamps numeric
        values to 1–365. Visibility is server-enforced: `super_admin` can view all costs;
        an `org_admin` can view cost only for its own `ORGANIZATION_BYOK` organization
        with an active credential. Otherwise cost values are zeroed and `cost.reason`
        explains the denial or missing credential.
      operationId: getAiSetupOrganizationUsage
      security:
        - sessionAuth: []
      parameters:
        - name: days
          in: query
          required: false
          description: Number of trailing days. Numeric values are clamped to 1–365.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Organization usage and visibility-filtered cost
          content:
            application/json:
              schema:
                type: object
                required: [org, cost, usage]
                properties:
                  org:
                    $ref: '#/components/schemas/AiSetupOrganization'
                  cost:
                    type: object
                    required: [canView, reason]
                    properties:
                      canView:
                        type: boolean
                      reason:
                        type: string
                        enum: [platform, org, denied, byok_missing_credential]
                  usage:
                    $ref: '#/components/schemas/AiSetupUsageSummary'
        '400':
          description: "Invalid organization ID or non-numeric `days`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ========================================
  # LLM Management APIs
  # ========================================

  /admin/llm/providers:
    get:
      tags:
        - Admin - LLM
      summary: List LLM providers
      operationId: listLLMProviders
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/LLMProvider'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Admin - LLM
      summary: Create LLM provider
      description: |
        Legacy provider write. While the consolidated AI & API Setup feature is
        enabled, this route returns `409 LEGACY_WRITE_DISABLED`; create organization
        credentials through `/admin/ai-setup/organizations/{id}/credentials` instead.
      operationId: createLLMProvider
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
                apiKey:
                  type: string
                apiBase:
                  type: string
                enabled:
                  type: boolean
      responses:
        '201':
          description: Provider created
        '409':
          description: Provider already exists, or this legacy write is disabled in favor of AI & API Setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                legacyWriteDisabled:
                  value:
                    error: This legacy settings page is read-only. Configure provider keys and AI/API capabilities from the consolidated AI & API Setup page.
                    code: LEGACY_WRITE_DISABLED

  /admin/llm/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Admin - LLM
      summary: Get provider details
      operationId: getLLMProvider
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Provider details
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin - LLM
      summary: Update provider
      description: |
        Legacy provider write. While the consolidated AI & API Setup feature is
        enabled, this route returns `409 LEGACY_WRITE_DISABLED`; replace organization
        credentials through `/admin/ai-setup/organizations/{id}/credentials` instead.
      operationId: updateLLMProvider
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                apiKey:
                  type: string
                apiBase:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Provider updated
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Legacy provider writes are disabled in favor of AI & API Setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: This legacy settings page is read-only. Configure provider keys and AI/API capabilities from the consolidated AI & API Setup page.
                code: LEGACY_WRITE_DISABLED

    delete:
      tags:
        - Admin - LLM
      summary: Delete or clear provider
      description: |
        Core providers are cleared rather than deleted. While the consolidated AI &
        API Setup feature is enabled, this legacy write returns
        `409 LEGACY_WRITE_DISABLED`; use the organization credential actions instead.
      operationId: deleteLLMProvider
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Provider deleted or cleared
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Legacy provider writes are disabled in favor of AI & API Setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: This legacy settings page is read-only. Configure provider keys and AI/API capabilities from the consolidated AI & API Setup page.
                code: LEGACY_WRITE_DISABLED

  /admin/llm/providers/{id}/test:
    post:
      tags:
        - Admin - LLM
      summary: Test provider connection
      operationId: testLLMProvider
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  success:
                    type: boolean
                  message:
                    type: string
                  models:
                    type: array
                    items:
                      type: string
                  error:
                    type: string

  /admin/llm/models:
    get:
      tags:
        - Admin - LLM
      summary: List enabled models
      operationId: listEnabledModels
      security:
        - sessionAuth: []
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
          description: If true, only return active models
      responses:
        '200':
          description: List of enabled models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnabledModel'

    post:
      tags:
        - Admin - LLM
      summary: Enable models (batch)
      operationId: enableModels
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [models]
              properties:
                models:
                  type: array
                  items:
                    type: object
                    required: [id, providerId, displayName]
                    properties:
                      id:
                        type: string
                      providerId:
                        type: string
                      displayName:
                        type: string
                      isDefault:
                        type: boolean
                      isActive:
                        type: boolean
                      toolCapable:
                        type: boolean
                      visionCapable:
                        type: boolean
      responses:
        '200':
          description: Models enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnabledModel'
                  skipped:
                    type: integer

  /admin/llm/models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Admin - LLM
      summary: Get model details
      operationId: getEnabledModel
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Model details
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin - LLM
      summary: Update model
      operationId: updateEnabledModel
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                isDefault:
                  type: boolean
                isActive:
                  type: boolean
                toolCapable:
                  type: boolean
                visionCapable:
                  type: boolean
                maxInputTokens:
                  type: integer
                sortOrder:
                  type: integer
      responses:
        '200':
          description: Model updated
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Admin - LLM
      summary: Remove model
      operationId: removeEnabledModel
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Model removed
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/llm/models/refresh:
    post:
      tags:
        - Admin - LLM
      summary: Refresh model capabilities
      operationId: refreshModelCapabilities
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Capabilities refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: integer
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnabledModel'

  /admin/llm/discover:
    get:
      tags:
        - Admin - LLM
      summary: Discover available models
      operationId: discoverModels
      security:
        - sessionAuth: []
      parameters:
        - name: provider
          in: query
          schema:
            type: string
          description: Specific provider ID, or omit for all providers
      responses:
        '200':
          description: Discovered models
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  provider:
                    type: string
                  models:
                    type: array
                    items:
                      type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        success:
                          type: boolean
                        models:
                          type: array
                          items:
                            type: string

  # ========================================
  # Autonomous Plan Control APIs
  # ========================================

  /autonomous/{planId}/pause:
    post:
      tags:
        - Autonomous
      summary: Pause autonomous plan
      description: Pause an active plan after the current task completes
      operationId: pauseAutonomousPlan
      security:
        - sessionAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Plan paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousPlanResponse'
        '400':
          description: Cannot pause plan with current status
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /autonomous/{planId}/resume:
    post:
      tags:
        - Autonomous
      summary: Resume paused plan
      operationId: resumeAutonomousPlan
      security:
        - sessionAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousPlanResponse'
        '400':
          description: Cannot resume plan with current status
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /autonomous/{planId}/stop:
    post:
      tags:
        - Autonomous
      summary: Stop autonomous plan
      description: Gracefully stop a plan, keeping all completed work
      operationId: stopAutonomousPlan
      security:
        - sessionAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Plan stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousPlanResponse'
        '400':
          description: Cannot stop plan with current status
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /autonomous/{planId}/tasks/{taskId}/skip:
    post:
      tags:
        - Autonomous
      summary: Skip task in plan
      operationId: skipAutonomousTask
      security:
        - sessionAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Task skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  task_id:
                    type: integer
                  status:
                    type: string
                  message:
                    type: string
        '400':
          description: Cannot skip task with current status
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

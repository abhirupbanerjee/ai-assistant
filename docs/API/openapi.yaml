          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Admin - Settings
      summary: Update settings
      description: |
        Update settings by type (admin only). While the consolidated AI & API Setup
        feature is enabled, writes for `llm`, `embedding`, `reranker`, `ocr`, and
        `tavily` settings are legacy writes and return `409 LEGACY_WRITE_DISABLED`;
        use `/admin/ai-setup` instead. Other settings types remain writable.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - rag
                    - llm
                    - acronyms
                    - tavily
                    - uploadLimits
                    - retention
                    - preset
                    - branding
                    - embedding
                    - reranker
                    - restoreAllDefaults
                settings:
                  type: object
                  description: Settings object (varies by type)
              required:
                - type
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  settings:
                    type: object
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A consolidated AI/provider setting can no longer be written through this legacy route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: This legacy settings page is read-only. Configure provider keys and AI/API capabilities from the consolidated AI & API Setup page.
                code: LEGACY_WRITE_DISABLED


# =============================================================================
# AI Assistant - Docker Compose Configuration
# =============================================================================
#
# SETUP: Volume permissions are handled automatically by the entrypoint.
#   For non-Docker development, run ./setup.sh first.
#
# PROFILES: Use profiles to select which services to run:
#
#   Vector Store:
#     --profile qdrant      → Qdrant vector store
#
#   Database:
#     --profile postgres    → PostgreSQL
#
#   Local LLM:
#     --profile ollama      → Ollama (set OLLAMA_API_BASE=http://ollama:11434)
#
# EXAMPLES:
#   PostgreSQL + Qdrant:   docker compose --profile postgres --profile qdrant up -d
#   PostgreSQL + Qdrant + Ollama: docker compose --profile postgres --profile qdrant --profile ollama up -d
#
# =============================================================================

services:
  traefik:
    image: traefik:v3.6.1
    container_name: policy-bot-traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Increase timeouts for SSE/long-running autonomous mode (30 minutes)
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=1800s"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=1800s"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=1800s"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - policy-bot-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy-bot-app
    environment:
      - NODE_ENV=production
      # Vector Store Configuration
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Database Configuration
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-policybot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-policybot}
      # Other Services
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      # Browser worker sidecar (remote browser sessions)
      - BROWSER_WORKER_URL=http://browser-worker:8780
      - BROWSER_WORKER_SHARED_SECRET=${BROWSER_WORKER_SHARED_SECRET}
      # Fix transformers cache permission (reranker model caching)
      - TRANSFORMERS_CACHE=/tmp/transformers_cache
      - XDG_CACHE_HOME=/tmp/cache
      # Hugging Face token for downloading gated models (local embeddings)
      - HF_TOKEN=${HF_TOKEN}
      # Azure AI Foundry — Entra ID auth for serverless model access (Route 5)
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT}
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # Increase timeouts for SSE/long-running autonomous mode connections
      - "traefik.http.middlewares.sse-timeout.headers.customRequestHeaders.Connection=keep-alive"
      - "traefik.http.routers.app.middlewares=sse-timeout"
      # SSE streaming: flush immediately for real-time updates
      - "traefik.http.services.app.loadbalancer.responseForwarding.flushInterval=100ms"
    volumes:
      - ./data/app:/app/data
      - ./config:/app/config:ro
      - ./data/transformers_cache:/tmp/transformers_cache  # Persist BGE reranker models (~670MB)
    # PostgreSQL: waits for healthy status when the postgres profile is active.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false  # Only enforced when postgres profile is active
    networks:
      - policy-bot-network
    restart: unless-stopped

  # Qdrant Vector Store
  # Start with: docker compose --profile qdrant up -d
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: policy-bot-qdrant
    profiles:
      - qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - policy-bot-network

  # PostgreSQL Database (optional - use when DATABASE_PROVIDER=postgres)
  # Start with: docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    container_name: policy-bot-postgres
    restart: unless-stopped
    profiles:
      - postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-policybot}
    volumes:
      - policybot-pgdata:/var/lib/postgresql/data
      - ./src/lib/db/schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-policybot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policy-bot-network

  redis:
    image: redis:7-alpine
    container_name: policy-bot-redis
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - policy-bot-network
    restart: unless-stopped

  # Browser Worker — isolated Playwright Chromium sidecar for remote browser
  # sessions. Runs non-root (in-image user), read-only root FS, no app/secret
  # mounts, and is only reachable from the app over the internal network.
  # NOTE: Chromium runs with its sandbox enabled (no --no-sandbox). If the host
  # kernel's default Docker seccomp profile blocks user namespaces, mount a
  # Chromium-compatible seccomp profile (e.g. --security-opt seccomp=chrome.json).
  browser-worker:
    build:
      context: ./services/browser-worker
      dockerfile: Dockerfile
    container_name: policy-bot-browser-worker
    environment:
      - NODE_ENV=production
      - PORT=8780
      - BROWSER_WORKER_SHARED_SECRET=${BROWSER_WORKER_SHARED_SECRET}
      - BROWSER_ALLOWLIST=${BROWSER_ALLOWLIST}
      - BROWSER_SESSION_TTL_MS=${BROWSER_SESSION_TTL_MS:-900000}
      - BROWSER_SCREENSHOT_INTERVAL_MS=${BROWSER_SCREENSHOT_INTERVAL_MS:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    read_only: true
    tmpfs:
      - /tmp/browser-profile:rw,size=256m
      - /tmp:rw,size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - policy-bot-network
    restart: unless-stopped

  # Ollama Local LLM Server (optional - use for local model inference)
  # Start with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:0.18.2
    container_name: policy-bot-ollama
    profiles:
      - ollama
    entrypoint: ["/bin/bash", "/ollama-entrypoint.sh"]
    volumes:
      - ollama-models:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - policy-bot-network
    restart: unless-stopped

  # GitHub Connector — microservice for GitHub API access (repos, issues, PRs)
  # Requires GITHUB_CONNECTOR_BEARER_TOKEN set and profile 'github' enabled.
  github-connector:
    profiles:
      - github
    build:
      context: ./services/github-connector
      dockerfile: Dockerfile
    container_name: policy-bot-github-connector
    environment:
      - PORT=8091
      - CONNECTOR_BEARER_TOKEN=${GITHUB_CONNECTOR_BEARER_TOKEN}
      - CONNECTOR_HMAC_SECRET=${CONNECTOR_HMAC_SECRET}
      - APP_BASE_URL=${NEXTAUTH_URL}
      - GITHUB_TIMEOUT_MS=30000
      - CORS_ORIGINS=*
      - LOG_LEVEL=${LOG_LEVEL:-info}
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - policy-bot-network
    restart: unless-stopped

  # Notion Connector — microservice for Notion API access (pages, databases, search)
  # Requires NOTION_CONNECTOR_BEARER_TOKEN set and profile 'notion' enabled.
  notion-connector:
    profiles:
      - notion
    build:
      context: ./services/notion-connector
      dockerfile: Dockerfile
    container_name: policy-bot-notion-connector
    environment:
      - PORT=8092
      - CONNECTOR_BEARER_TOKEN=${NOTION_CONNECTOR_BEARER_TOKEN}
      - CONNECTOR_HMAC_SECRET=${CONNECTOR_HMAC_SECRET}
      - APP_BASE_URL=${NEXTAUTH_URL}
      - NOTION_TIMEOUT_MS=30000
      - CORS_ORIGINS=*
      - LOG_LEVEL=${LOG_LEVEL:-info}
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - policy-bot-network
    restart: unless-stopped

  # Slack Connector — microservice for Slack API access (messages, channels, users)
  # Requires SLACK_CONNECTOR_BEARER_TOKEN set and profile 'slack' enabled.
  slack-connector:
    profiles:
      - slack
    build:
      context: ./services/slack-connector
      dockerfile: Dockerfile
    container_name: policy-bot-slack-connector
    environment:
      - PORT=8093
      - CONNECTOR_BEARER_TOKEN=${SLACK_CONNECTOR_BEARER_TOKEN}
      - CONNECTOR_HMAC_SECRET=${CONNECTOR_HMAC_SECRET}
      - APP_BASE_URL=${NEXTAUTH_URL}
      - SLACK_TIMEOUT_MS=30000
      - CORS_ORIGINS=*
      - LOG_LEVEL=${LOG_LEVEL:-info}
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - policy-bot-network
    restart: unless-stopped

  # GitBook Connector — microservice for GitBook API access (spaces, pages, search, comments)
  # Requires GITBOOK_CONNECTOR_BEARER_TOKEN set and profile 'gitbook' enabled.
  gitbook-connector:
    profiles:
      - gitbook
    build:
      context: ./services/gitbook-connector
      dockerfile: Dockerfile
    container_name: policy-bot-gitbook-connector
    environment:
      - PORT=8094
      - CONNECTOR_BEARER_TOKEN=${GITBOOK_CONNECTOR_BEARER_TOKEN}
      - CONNECTOR_HMAC_SECRET=${CONNECTOR_HMAC_SECRET}
      - APP_BASE_URL=${NEXTAUTH_URL}
      - GITBOOK_TIMEOUT_MS=30000
      - CORS_ORIGINS=*
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - policy-bot-network
    restart: unless-stopped

networks:
  policy-bot-network:
    name: policy-bot-network

volumes:
  letsencrypt:
    name: policy-bot-letsencrypt
  policybot-pgdata:
    name: policybot-pgdata
  ollama-models:
    name: policy-bot-ollama-models

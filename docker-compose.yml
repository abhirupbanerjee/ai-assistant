# =============================================================================
# Policy Bot - Docker Compose Configuration
# =============================================================================
#
# SETUP: Volume permissions are handled automatically by the entrypoint.
#   For non-Docker development, run ./setup.sh first.
#
# PROFILES: Use profiles to select which services to run:
#
#   Vector Store (choose one):
#     --profile chromadb    → ChromaDB (default, set VECTOR_STORE_PROVIDER=chromadb)
#     --profile qdrant      → Qdrant (set VECTOR_STORE_PROVIDER=qdrant)
#
#   Database (choose one):
#     (no profile)          → SQLite (default, set DATABASE_PROVIDER=sqlite)
#     --profile postgres    → PostgreSQL (set DATABASE_PROVIDER=postgres)
#
# EXAMPLES:
#   SQLite + ChromaDB:     docker compose --profile chromadb up -d
#   SQLite + Qdrant:       docker compose --profile qdrant up -d
#   PostgreSQL + ChromaDB: docker compose --profile postgres --profile chromadb up -d
#   PostgreSQL + Qdrant:   docker compose --profile postgres --profile qdrant up -d
#
# =============================================================================

services:
  traefik:
    image: traefik:v3.6.1
    container_name: policy-bot-traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Increase timeouts for SSE/long-running autonomous mode (30 minutes)
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=1800s"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=1800s"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=1800s"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - policy-bot-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy-bot-app
    environment:
      - NODE_ENV=production
      # Vector Store Configuration
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Database Configuration
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-policybot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-policybot}
      # Other Services
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      # Point to LiteLLM proxy for multi-provider LLM support
      - OPENAI_BASE_URL=http://litellm:4000/v1
      # Fix transformers cache permission (reranker model caching)
      - TRANSFORMERS_CACHE=/tmp/transformers_cache
      - XDG_CACHE_HOME=/tmp/cache
      # Hugging Face token for downloading gated models (local embeddings)
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # Increase timeouts for SSE/long-running autonomous mode connections
      - "traefik.http.middlewares.sse-timeout.headers.customRequestHeaders.Connection=keep-alive"
      - "traefik.http.routers.app.middlewares=sse-timeout"
      # SSE streaming: flush immediately for real-time updates
      - "traefik.http.services.app.loadbalancer.responseForwarding.flushInterval=100ms"
    volumes:
      - ./data/app:/app/data
      - ./config:/app/config:ro
      - ./data/transformers_cache:/tmp/transformers_cache  # Persist BGE reranker models (~670MB)
    # Note: Vector store (chroma/qdrant) dependencies are handled via profiles.
    # PostgreSQL: waits for healthy status when the postgres profile is active.
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false  # Only enforced when postgres profile is active
    networks:
      - policy-bot-network
    restart: unless-stopped

  # ChromaDB Vector Store (use when VECTOR_STORE_PROVIDER=chromadb)
  # Start with: docker compose --profile chromadb up -d
  chroma:
    image: chromadb/chroma:latest
    container_name: policy-bot-chroma
    profiles:
      - chromadb
    volumes:
      - ./data/chroma:/data
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=false
      - IS_PERSISTENT=TRUE
    networks:
      - policy-bot-network
    restart: unless-stopped

  # Qdrant Vector Store (use when VECTOR_STORE_PROVIDER=qdrant)
  # Start with: docker compose --profile qdrant up -d
  qdrant:
    image: qdrant/qdrant:latest
    container_name: policy-bot-qdrant
    profiles:
      - qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - policy-bot-network

  # PostgreSQL Database (optional - use when DATABASE_PROVIDER=postgres)
  # Start with: docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    container_name: policy-bot-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-policybot}
    volumes:
      - policybot-pgdata:/var/lib/postgresql/data
      # Auto-run schema on first init (only executes once when DB is created)
      - ./src/lib/db/schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-policybot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - policy-bot-network

  redis:
    image: redis:7-alpine
    container_name: policy-bot-redis
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - policy-bot-network
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: policy-bot-litellm
    volumes:
      - ./litellm-proxy/litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      # Clear OPENAI_BASE_URL so LiteLLM uses direct OpenAI endpoint (prevents loop)
      - OPENAI_BASE_URL=
      - STORE_MODEL_IN_DB=False
      - DISABLE_SPEND_LOGS=True
    command: --config /app/config.yaml --port 4000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - policy-bot-network
    restart: unless-stopped

networks:
  policy-bot-network:
    name: policy-bot-network

volumes:
  letsencrypt:
    name: policy-bot-letsencrypt
  policybot-pgdata:
    name: policybot-pgdata

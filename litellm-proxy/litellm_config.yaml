# =============================================================================
# LITELLM PROXY CONFIGURATION
# Models synced with config/defaults.json
# Updated: February 2026
# =============================================================================

model_list:

  # ===========================================================================
  # OPENAI CHAT MODELS - GPT-4.1 Family
  # All GPT-4.1 models support vision/multimodal with image_url format
  # ===========================================================================
  - model_name: gpt-4.1
    litellm_params:
      model: gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  - model_name: gpt-4.1-mini
    litellm_params:
      model: gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  - model_name: gpt-4.1-nano
    litellm_params:
      model: gpt-4.1-nano
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # ===========================================================================
  # OPENAI CHAT MODELS - GPT-5 Family
  # GPT-5.2 is the latest flagship model (August 2025 knowledge cutoff)
  # All GPT-5 models support vision, function calling, and structured outputs
  # ===========================================================================

  # GPT-5.2 - Latest flagship model
  - model_name: gpt-5.2
    litellm_params:
      model: gpt-5.2
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 400000

  # GPT-5.2 Pro - Enhanced flagship
  - model_name: gpt-5.2-pro
    litellm_params:
      model: gpt-5.2-pro
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 400000

  # GPT-5.1 - Previous flagship, recommended for coding/agentic tasks
  - model_name: gpt-5.1
    litellm_params:
      model: gpt-5.1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 400000

  # GPT-5 Mini - Lightweight variant
  - model_name: gpt-5-mini
    litellm_params:
      model: gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 400000

  # GPT-5 - Base model
  - model_name: gpt-5
    litellm_params:
      model: gpt-5
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # GPT-5 Nano - Lightweight variant
  - model_name: gpt-5-nano
    litellm_params:
      model: gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # GPT-5 Chat Latest - Rolling alias to latest chat model
  - model_name: gpt-5-chat-latest
    litellm_params:
      model: gpt-5-chat-latest
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # ===========================================================================
  # ANTHROPIC CLAUDE MODELS
  # All Claude 4.5 models support vision and function calling
  # Context window: 1M tokens
  # ===========================================================================

  # Claude Sonnet 4.5 - Best balance of speed/capability
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # Claude Haiku 4.5 - Fast and cost-effective
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # Claude Opus 4.5 - Maximum capability
  - model_name: claude-opus-4-5
    litellm_params:
      model: anthropic/claude-opus-4-5-20251101
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  # ===========================================================================
  # DEEPSEEK MODELS
  # Note: DeepSeek models do NOT support vision
  # Model names must match DeepSeek API model IDs
  # ===========================================================================

  # DeepSeek Reasoner - Reasoning model with chain-of-thought (V3.2 thinking mode)
  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      max_input_tokens: 64000

  # DeepSeek Chat - General chat model (V3.2 non-thinking mode)
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      max_input_tokens: 128000

  # ===========================================================================
  # MISTRAL AI MODELS
  # Mistral Large 3+ and Small 3.2+ support vision via Pixtral architecture
  # Uses same image_url format as OpenAI
  # ===========================================================================
  - model_name: mistral-large-latest
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 256000

  - model_name: mistral-small-3.2
    litellm_params:
      model: mistral/mistral-small-2506
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true

  # Alias for mistral-large-latest (for defaults.json compatibility)
  - model_name: mistral-large-3
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 256000

  # ===========================================================================
  # GOOGLE GEMINI MODELS
  # Note: LiteLLM automatically converts OpenAI image_url format to Gemini's
  # inline_data format for multimodal requests
  # ===========================================================================
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1000000

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1049000

  - model_name: gemini-3-pro-preview
    litellm_params:
      model: gemini/gemini-3-pro-preview
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1049000

  # ===========================================================================
  # OLLAMA LOCAL MODELS
  # ===========================================================================
  - model_name: ollama-llama3.2
    litellm_params:
      model: ollama/llama3.2
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      supports_function_calling: true

  - model_name: ollama-qwen2.5
    litellm_params:
      model: ollama/qwen2.5
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      supports_function_calling: true

  - model_name: ollama-mistral
    litellm_params:
      model: ollama/mistral
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      supports_function_calling: true

  - model_name: ollama-phi4
    litellm_params:
      model: ollama/phi4
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      supports_function_calling: false

  # Additional Ollama models from defaults
  - model_name: ollama-gemma3
    litellm_params:
      model: ollama/gemma3:12b
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      supports_function_calling: true

  - model_name: ollama-gpt-oss
    litellm_params:
      model: ollama/gpt-oss:20b
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      supports_function_calling: true

  # ===========================================================================
  # EMBEDDING MODELS
  # ===========================================================================
  - model_name: text-embedding-3-large
    litellm_params:
      model: text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY

  - model_name: ollama-mxbai-embed
    litellm_params:
      model: ollama/mxbai-embed-large
      api_base: os.environ/OLLAMA_API_BASE

  # ===========================================================================
  # AUDIO/TRANSCRIPTION MODELS
  # ===========================================================================
  - model_name: whisper-1
    litellm_params:
      model: whisper-1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: voxtral-mini
    litellm_params:
      model: mistral/voxtral-mini-latest
      api_key: os.environ/MISTRAL_API_KEY

# =============================================================================
# LITELLM SETTINGS
# =============================================================================

litellm_settings:
  drop_params: true
  request_timeout: 300

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # database_url: os.environ/LITELLM_DATABASE_URL
  disable_spend_logs: true
  store_model_in_db: false

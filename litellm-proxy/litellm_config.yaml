# =============================================================================
# LITELLM SETTINGS
# =============================================================================

litellm_settings:
  drop_params: true
  request_timeout: 300

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # database_url: os.environ/LITELLM_DATABASE_URL
  disable_spend_logs: true
  store_model_in_db: false

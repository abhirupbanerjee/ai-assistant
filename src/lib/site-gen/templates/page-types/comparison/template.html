<!-- Comparison Page Template -->
<section class="comparison-page" style="padding: var(--spacing-section) var(--spacing-md);">
  <div class="container" style="max-width: var(--content-width); margin: 0 auto;">
    <header style="text-align: center; margin-bottom: var(--spacing-xl);">
      <h1 style="font-family: var(--font-heading); font-size: var(--font-size-h1); color: var(--color-text);">
        {{page_title}}
      </h1>
    </header>

    <div style="overflow-x: auto;">
      <table style="
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-family: var(--font-body);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius);
        overflow: hidden;
      ">
        <thead>
          <tr style="background: var(--color-primary);">
            <th style="padding: var(--spacing-md); color: white; font-size: var(--font-size-base); text-align: left;">
              Feature
            </th>
            {{#columns}}
            <th style="padding: var(--spacing-md); color: white; font-size: var(--font-size-base); text-align: center;">
              <div style="font-weight: 700;">{{name}}</div>
              {{#description}}
              <div style="font-size: var(--font-size-small); opacity: 0.85; margin-top: 2px;">{{description}}</div>
              {{/description}}
            </th>
            {{/columns}}
          </tr>
        </thead>
        <tbody>
          {{#rows}}
          <tr style="border-bottom: 1px solid var(--color-border);">
            <td style="
              padding: var(--spacing-md);
              font-weight: 500;
              color: var(--color-text);
              background: var(--color-surface);
            ">{{feature}}</td>
            {{#values}}
            <td style="
              padding: var(--spacing-md);
              text-align: center;
              color: var(--color-text);
              background: var(--color-background);
            ">{{.}}</td>
            {{/values}}
          </tr>
          {{/rows}}
        </tbody>
      </table>
    </div>

    {{#verdict}}
    <div style="
      margin-top: var(--spacing-xl);
      padding: var(--spacing-lg);
      background: var(--color-surface);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--border-radius);
    ">
      <h3 style="font-family: var(--font-heading); font-size: var(--font-size-h3); color: var(--color-text); margin-bottom: var(--spacing-sm);">
        Our Verdict
      </h3>
      <p style="font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text-muted); line-height: var(--line-height);">
        {{verdict}}
      </p>
    </div>
    {{/verdict}}
  </div>
</section>

<!-- Detail Page Template -->
<section class="detail-page" style="max-width: var(--content-width); margin: 0 auto; padding: 0 var(--spacing-md);">
  {{#header_image_url}}
  <div class="detail-hero" style="margin-bottom: var(--spacing-xl);">
    <img src="{{header_image_url}}" alt="{{page_title}}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: var(--border-radius-lg);" loading="lazy" />
  </div>
  {{/header_image_url}}

  <header style="margin-bottom: var(--spacing-lg);">
    <h1 style="font-family: var(--font-heading); font-size: var(--font-size-h1); color: var(--color-text);">
      {{page_title}}
    </h1>
  </header>

  {{#metadata}}
  <div class="detail-metadata" style="
    display: flex; gap: var(--spacing-lg); flex-wrap: wrap;
    padding: var(--spacing-md) 0;
    border-top: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
    margin-bottom: var(--spacing-xl);
  ">
    {{#metadata}}
    <div>
      <span style="font-family: var(--font-body); font-size: var(--font-size-small); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
        {{label}}
      </span>
      <p style="font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text); font-weight: 500;">
        {{value}}
      </p>
    </div>
    {{/metadata}}
  </div>
  {{/metadata}}

  <div class="detail-description" style="
    font-family: var(--font-body);
    font-size: var(--font-size-base);
    line-height: var(--line-height);
    color: var(--color-text);
    max-width: var(--content-width-narrow);
  ">
    <p>{{description}}</p>
  </div>

  {{#related_items}}
  <section style="margin-top: var(--spacing-xl); padding-top: var(--spacing-lg); border-top: 1px solid var(--color-border);">
    <h2 style="font-family: var(--font-heading); font-size: var(--font-size-h2); color: var(--color-text); margin-bottom: var(--spacing-md);">
      Related
    </h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--spacing-md);">
      {{#related_items}}
      <a href="{{url}}" style="
        display: block;
        padding: var(--spacing-md);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius);
        text-decoration: none;
        transition: border-color var(--transition-fast);
      ">
        <h4 style="font-family: var(--font-heading); font-size: var(--font-size-base); color: var(--color-text);">
          {{title}}
        </h4>
      </a>
      {{/related_items}}
    </div>
  </section>
  {{/related_items}}
</section>

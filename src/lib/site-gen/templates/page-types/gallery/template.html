<!-- Gallery Page Template -->
<section class="gallery-page" style="padding: var(--spacing-section) var(--spacing-md);">
  <div class="container" style="max-width: var(--content-width); margin: 0 auto;">
    <header style="text-align: center; margin-bottom: var(--spacing-xl);">
      <h1 style="font-family: var(--font-heading); font-size: var(--font-size-h1); color: var(--color-text);">
        {{page_title}}
      </h1>
      {{#page_description}}
      <p style="font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text-muted); margin-top: var(--spacing-sm);">
        {{page_description}}
      </p>
      {{/page_description}}
    </header>

    {{#filters}}
    <div class="gallery-filters" style="display: flex; gap: var(--spacing-sm); flex-wrap: wrap; justify-content: center; margin-bottom: var(--spacing-lg);">
      <button class="filter-btn active" style="
        padding: var(--spacing-xs) var(--spacing-md);
        background: var(--color-primary);
        color: white;
        border: none;
        border-radius: var(--border-radius-pill);
        font-family: var(--font-body);
        font-size: var(--font-size-small);
        cursor: pointer;
      ">All</button>
      {{#filters}}
      <button class="filter-btn" style="
        padding: var(--spacing-xs) var(--spacing-md);
        background: var(--color-surface);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-pill);
        font-family: var(--font-body);
        font-size: var(--font-size-small);
        cursor: pointer;
        transition: all var(--transition-fast);
      " onmouseover="this.style.background='var(--color-primary)'; this.style.color='white'" onmouseout="this.style.background='var(--color-surface)'; this.style.color='var(--color-text)'">
        {{filter_label}}
      </button>
      {{/filters}}
    </div>
    {{/filters}}

    <div class="gallery-grid" style="
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--spacing-md);
    ">
      {{#items}}
      <figure class="gallery-item" style="
        position: relative;
        border-radius: var(--border-radius);
        overflow: hidden;
        cursor: pointer;
        margin: 0;
      ">
        <img src="{{image_url}}" alt="{{image_alt}}" style="
          width: 100%;
          height: 250px;
          object-fit: cover;
          transition: transform var(--transition-base);
        " loading="lazy" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" />
        <figcaption style="
          position: absolute;
          bottom: 0;
          left: 0; right: 0;
          padding: var(--spacing-md);
          background: linear-gradient(transparent, rgba(0,0,0,0.7));
        ">
          <h3 style="font-family: var(--font-heading); font-size: var(--font-size-base); color: white; margin: 0;">
            {{item_title}}
          </h3>
          {{#item_description}}
          <p style="font-family: var(--font-body); font-size: var(--font-size-small); color: rgba(255,255,255,0.8); margin: var(--spacing-xs) 0 0 0;">
            {{item_description}}
          </p>
          {{/item_description}}
        </figcaption>
      </figure>
      {{/items}}
    </div>
  </div>
</section>

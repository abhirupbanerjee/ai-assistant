<!-- Form Page Template -->
<section class="form-page" style="max-width: var(--content-width-narrow); margin: 0 auto; padding: var(--spacing-section) var(--spacing-md);">
  <header style="text-align: center; margin-bottom: var(--spacing-xl);">
    <h1 style="font-family: var(--font-heading); font-size: var(--font-size-h1); color: var(--color-text);">
      {{page_title}}
    </h1>
    {{#page_description}}
    <p style="font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text-muted); margin-top: var(--spacing-sm);">
      {{page_description}}
    </p>
    {{/page_description}}
  </header>

  <form style="
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--border-radius-lg);
    padding: var(--spacing-xl);
  " onsubmit="event.preventDefault(); this.querySelector('.form-success').style.display='block'; this.querySelector('.form-fields').style.display='none';">
    <div class="form-fields">
      {{#fields}}
      <div class="form-group" style="margin-bottom: var(--spacing-lg);">
        <label style="
          display: block;
          font-family: var(--font-body);
          font-size: var(--font-size-small);
          font-weight: 500;
          color: var(--color-text);
          margin-bottom: var(--spacing-xs);
        ">
          {{label}}{{#required}} <span style="color: var(--color-error);">*</span>{{/required}}
        </label>
        {{#type}}
        {{#textarea}}
        <textarea name="{{name}}" {{#required}}required{{/required}} placeholder="{{placeholder}}" style="
          width: 100%;
          padding: var(--spacing-sm);
          font-family: var(--font-body);
          font-size: var(--font-size-base);
          color: var(--color-text);
          background: var(--color-background);
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius);
          min-height: 120px;
          resize: vertical;
        "></textarea>
        {{/textarea}}
        {{^textarea}}
        <input type="{{type}}" name="{{name}}" {{#required}}required{{/required}} placeholder="{{placeholder}}" style="
          width: 100%;
          padding: var(--spacing-sm);
          font-family: var(--font-body);
          font-size: var(--font-size-base);
          color: var(--color-text);
          background: var(--color-background);
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius);
        " />
        {{/textarea}}
        {{/type}}
        
        {{^type}}
        <input type="text" name="{{name}}" {{#required}}required{{/required}} placeholder="{{placeholder}}" style="
          width: 100%;
          padding: var(--spacing-sm);
          font-family: var(--font-body);
          font-size: var(--font-size-base);
          color: var(--color-text);
          background: var(--color-background);
          border: 1px solid var(--color-border);
          border-radius: var(--border-radius);
        " />
        {{/type}}
      </div>
      {{/fields}}

      <button type="submit" style="
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-lg);
        background: var(--color-primary);
        color: white;
        font-family: var(--font-body);
        font-size: var(--font-size-base);
        font-weight: 600;
        border: none;
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: background var(--transition-fast);
      " onmouseover="this.style.background='var(--color-primary-hover)'" onmouseout="this.style.background='var(--color-primary)'">
        {{submit_label}}
      </button>
    </div>

    <div class="form-success" style="display: none; text-align: center; padding: var(--spacing-xl);">
      <div style="
        width: 64px; height: 64px;
        background: var(--color-success);
        border-radius: 50%;
        margin: 0 auto var(--spacing-md);
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 2rem;
      ">✓</div>
      <h3 style="font-family: var(--font-heading); font-size: var(--font-size-h3); color: var(--color-text);">
        {{success_message}}
      </h3>
    </div>
  </form>
</section>

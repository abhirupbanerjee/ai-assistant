<!-- Shared Navigation Component -->
<!-- Injected into every generated page -->

<nav class="site-nav" style="
  background: var(--color-background);
  border-bottom: 1px solid var(--color-border);
  padding: var(--spacing-sm) var(--spacing-md);
  position: sticky;
  top: 0;
  z-index: 100;
">
  <div class="nav-container" style="
    max-width: var(--content-width);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  ">
    <a href="index.html" class="nav-logo" style="
      font-family: var(--font-heading);
      font-size: var(--font-size-h3);
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 700;
    ">{{site_name}}</a>

    <button class="nav-toggle" aria-label="Toggle navigation" style="
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--spacing-sm);
    " onclick="document.querySelector('.nav-links').classList.toggle('nav-open')">
      <span style="display: block; width: 24px; height: 2px; background: var(--color-text); margin: 4px 0;"></span>
      <span style="display: block; width: 24px; height: 2px; background: var(--color-text); margin: 4px 0;"></span>
      <span style="display: block; width: 24px; height: 2px; background: var(--color-text); margin: 4px 0;"></span>
    </button>

    <ul class="nav-links" style="
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: var(--spacing-md);
    ">
      {{#pages}}
      <li>
        <a href="{{page_url}}" style="
          font-family: var(--font-body);
          font-size: var(--font-size-base);
          color: {{#is_active}}var(--color-primary){{/is_active}}{{^is_active}}var(--color-text-muted){{/is_active}};
          text-decoration: none;
          transition: color var(--transition-fast);
        " onmouseover="this.style.color='var(--color-primary)'" onmouseout="this.style.color='{{#is_active}}var(--color-primary){{/is_active}}{{^is_active}}var(--color-text-muted){{/is_active}}'">
          {{page_label}}
        </a>
      </li>
      {{/pages}}
    </ul>
  </div>
</nav>

<style>
  @media (max-width: 768px) {
    .nav-toggle { display: block !important; }
    .nav-links {
      display: none !important;
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--color-background);
      border-bottom: 1px solid var(--color-border);
      padding: var(--spacing-md);
    }
    .nav-links.nav-open { display: flex !important; }
  }
</style>

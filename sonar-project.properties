sonar.projectKey=abhirupbanerjee_policybot
sonar.organization=abhirupbanerjee

# Project metadata
sonar.projectName=Policy Bot
sonar.projectVersion=0.1.0

# Source code directories
sonar.sources=src

# Exclusions
sonar.exclusions=src/embed/**, src/scripts/**, src/types/**, **/*.test.ts, **/*.spec.ts, **/*.js

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# JavaScript/TypeScript analysis
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs
sonar.typescript.file.suffixes=.ts,.tsx,.cts,.mts

# Exclude build and configuration directories
sonar.exclusions=node_modules/**, .next/**, out/**, dist/**, build/**, data/**, litellm-proxy/**

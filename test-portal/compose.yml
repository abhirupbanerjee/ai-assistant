services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://portal_app:${PORTAL_DB_PASSWORD:-portal_dev_only}@portal-postgres:5432/test_portal
      DATABASE_SSL: "false"
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:3100}
      PORTAL_ALLOW_INSECURE_LOCAL_DEVELOPMENT: "true"
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-development-session-secret-change-me}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-11111111-1111-4111-8111-111111111111}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-22222222-2222-4222-8222-222222222222}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-development-client-secret}
      PORTAL_ADMIN_EMAILS: ${PORTAL_ADMIN_EMAILS:-}
      PORTAL_ADMIN_OBJECT_IDS: ${PORTAL_ADMIN_OBJECT_IDS:-}
      NODE_ENV: production
    depends_on:
      portal-postgres:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-3100}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  portal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test_portal
      POSTGRES_USER: portal_app
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-portal_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_app -d test_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  portal-postgres-data:
